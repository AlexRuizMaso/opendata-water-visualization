name: 'Data ETL Pipeline'

permissions:
  contents: write

on:
  schedule:
    # Executa diàriament a les 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Permet execució manual des de GitHub
    inputs:
      fullSync:
        description: 'Full historical sync (paginat, restaura històric complet)'
        type: boolean
        default: false

jobs:
  etl-pipeline:
    runs-on: ubuntu-latest
    env:
      API_TIMEOUT: '60000'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # Ensure the runner has the GITHUB_TOKEN credentials available for pushing
          persist-credentials: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ETL Pipeline
        run: npm run full-pipeline --workspace=etl -- ${{ inputs.fullSync && '--full-sync' || '' }}
      
      - name: Copy data files to frontend
        run: |
          mkdir -p frontend/public/data
          cp etl/data/embassaments.json frontend/public/data/
          cp etl/data/precipitation.json frontend/public/data/
          cp etl/data/metadata.json frontend/public/data/
          cp etl/data/precipitation_*.json frontend/public/data/ || echo "No yearly files to copy"
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Force-add generated data files which may be ignored by .gitignore (incloses yearly archives)
          git add -f etl/data/precipitation_*.json frontend/public/data/precipitation_*.json || true
          git add -f etl/data/* || true
          git add -f frontend/public/data/* || true
          git add -A
          git commit -m "chore: update water data [skip ci]" || echo "No changes to commit"
      
      - name: Push changes
        run: |
          # Push committed changes using the GITHUB_TOKEN
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build --workspace=frontend
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
